<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>BR "Where do you hoop?" intro mockup (reference)</title>
<style>
@keyframes drop{0%{transform:translateY(-40px);opacity:0}70%{transform:translateY(4px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0);opacity:0}80%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.h{opacity:0;animation:drop .5s ease-out forwards;transform-box:fill-box}
.cr{opacity:0;animation:pop .45s ease-out 1.6s forwards;transform-box:fill-box;transform-origin:center}
.card{transform:translateY(100%);animation:up .5s ease-out 2.1s forwards}
@media (prefers-reduced-motion: reduce){.h,.cr{animation:none;opacity:1}.card{animation:none;transform:none}}
</style></head>
